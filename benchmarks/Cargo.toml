[package]
name = "openscion-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end benchmarks comparing OpenScion with git on synthetic repositories."
readme = "README.md"
keywords = ["vcs", "source-control", "benchmark"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "openscion-bench"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
# The OpenScion backend drives `scn` in-process against an in-process
# `openscion-server`, so no binaries need building first.
openscion = { workspace = true }
openscion-server = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
