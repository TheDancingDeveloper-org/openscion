[package]
name = "openscion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "scn, the OpenScion command-line client."
documentation = "https://docs.rs/openscion"
readme = "README.md"
keywords = ["vcs", "source-control", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "scn"
path = "src/main.rs"

[dependencies]
# The engine and, through its re-export, the protocol payloads the client
# decodes and the bind rule it applies.
openscion-core = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# Tests run a real server in-process and point the client at it.
openscion-server = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
