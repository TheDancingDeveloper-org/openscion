[package]
name = "openscion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A server-centric, content-addressed source control engine for agent-scale monorepos."
documentation = "https://docs.rs/openscion"
readme = "../../README.md"
keywords = ["vcs", "source-control", "monorepo", "changeset"]
categories = ["development-tools"]

[dependencies]
# The protocol: payload types and the protocol version. Re-exported wholesale
# from `src/lib.rs` so a consumer takes one dependency rather than two, and so
# `openscion_core::GreetRequest` and `openscion_proto::GreetRequest` are the same
# type.
openscion-proto = { workspace = true }
thiserror = { workspace = true }

[features]
default = []

[lints]
workspace = true
